# ================================================================
# 线程池拒绝策略可观测性告警规则
# ================================================================
# 目标：监控异步任务执行器的拒绝计数，提供分级告警
# 阈值配置：
#   - warning: rejected_count > 10/min
#   - critical: rejected_count > 50/min
# ----------------------------------------------------------------
# 指标名真相源 = deploy/prometheus/expected-metric-names.txt
#   由 src/test/java/com/slz/crm/platform/monitoring/PrometheusExportTruthCaptureTest.java
#   真起上下文抓 /actuator/prometheus 生成；改名字前先重采，别手抄。
#   生产端 Counter 注册名是 async.task.rejected（PlatformAsyncConfig），
#   Micrometer→Prometheus 导出为 **async_task_rejected_total**（counter 一律带 _total）。
#   查裸名 async_task_rejected 拿不到任何序列：increase() 恒空、告警永不触发（TASK-16 修的前半段）。
# 实际带的 label：executor（线程池名，取值 platform-batch-upload / platform-stream-chat /
#   platform-embedding / platform-document-parsing / platform-memory-bypass /
#   platform-derived-questions）、policy（discard-log | abort | caller-runs）、application。
# 门禁：MonitoringArtifactConsistencyTest（名字/label/absent 条款）+ CI 里 promtool check rules。
# ================================================================

groups:
  - name: thread-pool-rejection-alerts
    interval: 30s
    rules:
      # 警告级别：每分钟拒绝次数超过 10
      - alert: ThreadPoolRejectionWarning
        expr: |
          increase(async_task_rejected_total[1m]) > 10
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "线程池拒绝率警告 - {{ $labels.executor }}"
          description: "异步任务执行器 {{ $labels.executor }} (策略：{{ $labels.policy }}) 在过去 2 分钟内每分钟拒绝次数超过 10 次。当前值：{{ $value }} 次/分钟"

      # 严重级别：每分钟拒绝次数超过 50
      - alert: ThreadPoolRejectionCritical
        expr: |
          increase(async_task_rejected_total[1m]) > 50
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "线程池拒绝率严重告警 - {{ $labels.executor }}"
          description: "异步任务执行器 {{ $labels.executor }} (策略：{{ $labels.policy }}) 在过去 1 分钟内每分钟拒绝次数超过 50 次。当前值：{{ $value }} 次/分钟\n\n建议操作：\n1. 检查系统负载和队列容量\n2. 考虑增加最大线程数或队列容量\n3. 查看是否有慢任务阻塞执行器\n4. 检查拒绝策略是否为预期行为（discard-log 可能丢失任务）"

      # 指标可用性告警（族级）：整族消失 = 应用没起 / actuator 没暴露 / registry 被关。
      # 历史条款 absent(async_task_rejected{executor=""}) 已废弃两处：
      #   ① 裸名不导出；② 真导出里 executor 恒为非空线程池名，"executor 等于空串"永远匹不到
      #      序列 → absent() 恒返回 1 → 告警永久误触发（看起来在盯指标，其实在刷屏）。
      - alert: ThreadPoolMetricsMissing
        expr: |
          absent(async_task_rejected_total)
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "线程池拒绝指标整族缺失"
          description: "未检测到 async_task_rejected_total 指标，请检查应用是否启动、/actuator/prometheus 是否可抓、PlatformAsyncConfig 是否正确注册到 Micrometer"

      # 指标可用性告警（关键执行器级）：族还在、但主答链路的执行器序列没了
      # = 线程池被改名/删掉/拒绝策略注册漏了，属于配置回归，必须单独报。
      - alert: StreamChatRejectionMetricMissing
        expr: |
          absent(async_task_rejected_total{executor="platform-stream-chat"})
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "流式问答执行器拒绝指标缺失 - platform-stream-chat"
          description: "async_task_rejected_total 族仍在，但没有 executor=\"platform-stream-chat\" 的序列：该线程池很可能被改名或拒绝计数注册被摘掉，请核对 PlatformAsyncConfig#streamChatTaskExecutor"
