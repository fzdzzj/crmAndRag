openapi: 3.1.0
info:
  title: API Documentation
  version: "1.0"
servers:
- url: http://localhost:8080
  description: Generated server url
paths:
  /ai/chat/stream:
    post:
      tags:
      - ai-chat-controller
      summary: AI chat stream (SSE)
      requestBody:
        content:
          application/json:
            schema:
              type: object
        required: true
      responses:
        "200":
          description: OK
          content:
            text/event-stream:
              schema:
                type: string
  /ai/chat/cancel:
    post:
      tags:
      - ai-chat-controller
      summary: Cancel AI chat
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResultBoolean"
  /ai/sessions:
    post:
      tags:
      - ai-chat-controller
      summary: Create AI session
      requestBody:
        content:
          application/json:
            schema:
              type: object
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResultString"
    get:
      tags:
      - ai-chat-controller
      summary: List AI sessions
      parameters:
      - name: cursorTime
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: cursorId
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 10
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResultListAiSessionVO"
  /ai/sessions/{id}/messages:
    get:
      tags:
      - ai-chat-controller
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
