# ================================================================
# CI 门禁（task18：契约/安全/数据权限/韧性/RAG 评估纳入 CI + 回归阈值）
#
# ⚠ 触发通道现状（必读，勿按字面理解为"失败会自动拦下合入"）：
#   remote 与 upstream 均已配置（自查：git remote -v、git rev-parse --abbrev-ref master@{upstream}），
#   push/PR 触发已真实执行——最早两次 failure（36229004762@2026-09-26、36522264015@2026-09-29，
#   根因与处置见 docs/main-agent-logbook.md §18 与卡 H）已成史实；经多轮治理，远端 CI 已常态全绿
#   （最近实测锚点：Run 37944875404 @ b47593c，6/6 全绿，2026-10-09；运行清单自查：gh run list --limit 20）。
#   尽管 Actions 远端全绿已常态化，合并前真实验收边界仍在本地：
#       bash scripts/merge-gate.sh
#   它与本文件的 job 同源（跑同一批判定命令），结论可本地复现；本地门禁全绿仍为法定合并前置。
#   合并序列见 openspec/git-workflow.md §3。
#
# 门禁语义（仅在有触发通道时成立）：任一阶段失败即阻止合入；
#   单元测试(surefire) + 集成测试(failsafe) 分开跑，先快后慢。
#   ubuntu-latest 自带 Docker → Testcontainers IT（含 Flyway 真库迁移）可真跑；
#   本地无 Docker 时哪些用例会跳、哪些会红，以 docs/migration-runbook.md §6.2 的分类为准。
# ================================================================
name: CI

on:
  push:
    branches: [ master, integration, "spec/**", "feature/**" ]
  pull_request:

jobs:
  build-and-gate:
    runs-on: ubuntu-24.04
    steps:
      - name: 检出
        uses: actions/checkout@v5

      - name: 装配 JDK 21 + Maven 缓存
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # 阶段1：编译 + 单元测试（surefire，*Test.java，含 SSE 契约测试、H2 上下文冒烟）——快，先拦低级错误
      - name: 单元测试与契约门禁（surefire）
        run: mvn -B -ntp test

      # 阶段2：集成测试（failsafe，*IT.java，Docker：Testcontainers MySQL）
      #   - FlywayMigrationIT：七脚本真库按序迁移（本地无 Docker 会 skip，CI 必跑）
      #   - AbstractMySqlIT 系列：全上下文 + 控制器/数据权限/写链回归
      #   - RagRealRetrievalBenchmarkIT：真检索质量基准（add-rag-quality-baseline），env 门控——
      #     仅当 RAG_BENCHMARK_REAL=1 且有 DASHSCOPE_API_KEY 才执行；默认 CI 恒按假设 skip、不发外网请求，
      #     启用后把含全部指标的 JSON 报告落盘 docs/rag-quality/baseline-v1.json（提案 2–5 的不回退锚点）
      - name: 预拉取 Qdrant 集成测试镜像
        run: docker pull qdrant/qdrant:v1.18.3

      - name: 集成测试门禁（failsafe + Testcontainers MySQL）
        run: mvn -B -ntp verify

      # 阶段3：回归基线门禁——由仓库自有脚本裁决，本地与 CI 跑同一条命令：
      #   bash scripts/check-test-baseline.sh
      # 阈值不在 YAML 里，而在 scripts/test-baseline.txt，且只允许由
      #   bash scripts/check-test-baseline.sh --update
      # 在一次真实 mvn -B -ntp clean verify 之后写入；当前运行含 Failures/Errors 或存在口径外残留时 --update 直接拒绝。
      # 脚本同时裁决五项：Failures 与 Errors 必须为 0、Tests run 不低于基线（防丢测试）、
      # Skipped 不高于基线（防整类被悄悄跳过；旧实现只对 Tests run 求和，看不到这一项）、
      # reports（默认口径内的报告文件数）不低于基线（防丢测试类：类被删/改名，或未被默认 includes 覆盖）。
      # 基线衡量的是 pom 默认 includes 定义的默认运行；报告目录里不属于该口径的报告（典型：opt-in 基准）
      # 是「口径外残留」，check 判红并逐份列名、--update 拒绝写入。口径细节见
      # scripts/check-test-baseline.sh 头部第 9-20 行，此处不复述。
      # 历史阶梯 639/644/645/649/653/657 与 failsafe 13 的来龙去脉见：
      #   git log -p -- scripts/test-baseline.txt .github/workflows/ci.yml
      - name: 回归基线阈值校验（surefire + failsafe 双口径）
        run: bash scripts/check-test-baseline.sh

      - name: 上传覆盖率与测试报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            target/site/jacoco/
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: ignore

  # TASK-09：前后端契约一致性门禁。判定就在阶段 1 的那条 surefire 用例里
  # （OpenApiContractExportTest 起完整上下文打 /v3/api-docs.yaml 与 frontend/openapi.yaml 逐字比对），
  # 本 job 只是把它单独立哨并打印差异，便于漂移时一眼看到少了哪个接口。
  # 故意与 build-and-gate 并行：等 Docker 集成测试跑完再报契约漂移只会拖慢反馈，不会增加信号。
  openapi-consistency-gate:
    name: OpenAPI Contract Consistency
    runs-on: ubuntu-24.04
    steps:
      - name: 检出
        uses: actions/checkout@v5

      - name: 装配 JDK 21 + Maven 缓存
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: 后端 swagger 导出与前端契约比对
        run: bash scripts/check-openapi-consistency.sh

      - name: 上传后端当前导出
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: openapi-export
          path: target/openapi/openapi.yaml
          if-no-files-found: warn

  # TASK-02：静态检查门禁（checkstyle / spotbugs / spotless）
  static-analysis-gate:
    needs: build-and-gate
    runs-on: ubuntu-24.04
    steps:
      - name: 检出
        uses: actions/checkout@v5

      - name: 装配 JDK 21 + Maven 缓存
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # 每一步的判定依据都写在下面并标注配置行，做到 grep 得到读者（spec R1②：禁止注入后无人读的阈值）。
      # 原先本步骤 env 注入的 CHECKSTYLE_MAX_VIOLATIONS / SPOTBUGS_MAX_HIGH / PMD_MAX_VIOLATIONS /
      # SPOTLESS_APPLY_DIFF 四个变量**全仓无读者**，已逐个删除，处置依据：
      #   - checkstyle 只有"存在 error 级违规即红"的二值口径，没有"允许 N 条"的计数概念；
      #   - spotbugs 的"什么算缺陷"与"存量多少"分别由 threshold 与 exclude 文件承载，不是计数阈值；
      #   - pmd 当时从未真正产出结论（见下方 pmd 段，该状态已于 2026-09-21 改变）；
      #   - SPOTLESS_APPLY_DIFF 不是 spotless-maven-plugin 认得的属性名（插件只读 pom 的 configuration）。
      #
      # checkstyle:check 判定依据：pom.xml:387 <failOnViolation>true</failOnViolation>
      #   + pom.xml:388 <violationSeverity>error</violationSeverity>（规则集 src/main/resources/checkstyle.xml）。
      # spotbugs:check   判定依据：pom.xml:418 <threshold>High</threshold> 定义"什么算缺陷"，
      #   pom.xml:423 <excludeFilterFile>src/main/resources/spotbugs-exclude.xml</excludeFilterFile> 承载存量
      #   High 基线台账；不在台账内的新 High 直接变红。基线只允许由
      #   `mvn -B -ntp compile spotbugs:spotbugs` 的一次真实运行更新（过期豁免双射校验：
      #   bash scripts/tests/spotbugs-exclude-staleness-check.sh）。
      # spotless:check   判定依据：pom.xml:505-517 的 <java> 格式化配置（googleJavaFormat GOOGLE），
      #   该插件块无 <skip>，格式不合规即红。
      #
      # pmd:check 判定依据（wire-pmd-ruleset P2 于 2026-09-21 把本步加回，三层各一个读者，行号会随
      #   pom 变动漂移，定位一律用括号里的 grep 锚点）：
      #   ① 量哪把尺子 = <ruleset>src/main/resources/pmd-rules.xml</ruleset>（pom 第 459 行，
      #      `grep -n "<ruleset>src" pom.xml`）——25 条声明规则（Q4 拍板补 EmptyControlStatement 后），不是插件内置 quickstart；
      #   ② 哪条违规计入条数 = <failurePriority>（pom 第 462 行，`grep -n failurePriority pom.xml`）；
      #   ③ 计入多少条算失败 = <maxAllowedViolations>（pom 第 469 行，
      #      `grep -n maxAllowedViolations pom.xml`）——**全仓唯一的条数读者**，本 YAML 故意不复制
      #      那个数字。它的值只允许由一次真实 `mvn -B -ntp pmd:check` 经
      #      `bash scripts/tests/pmd-baseline-check.sh --update` 写入
      #      scripts/tests/pmd-violation-baseline.txt，且只许下调不许上调（口径同阶段3）。
      #      边界语义是实测的：实测 == 登记 → 绿，实测 > 登记 → 红；因此修掉一条异味后本步仍会绿，
      #      "该下调了"由 `bash scripts/tests/pmd-baseline-check.sh` 单独判（登记 > 实测即红）。
      #      基线只覆盖 src/main/java（PMD 默认不含 src/test/java），与上面 spotbugs 的 12 条
      #      不是同一口径、不可类比——两侧口径都写在各自台账的头部。
      #   本步此前被移除的原因是 pom 的 pmd 块挂着字面量 <skip>true</skip>（"跑了不产生结论就别装成在跑"），
      #   豁免四要素与三条理由的消除过程保留在 docs/migration-runbook.md §6.7 作历史对照。
      #
      # 命令以 `compile` 开头是必需的，不是冗余：本 job 是独立 checkout，没有前置构建，而 spotbugs:check
      #   读的是 target/classes。缺产物时它会"无类可分析"地静默通过 —— 又回到"装成在跑"。
      #   同时 compile 会连带触发 pom 里绑到 validate 阶段的 checkstyle-check（pom.xml:391-397）与
      #   spotless-check（pom.xml:520-526），后面显式再点一次是为了让这三项在命令行上都能被读到，
      #   不依赖"有人记得 pom 里绑过阶段"。
      - name: 静态检查门禁（checkstyle / spotbugs / spotless / pmd）
        run: mvn -B -ntp compile checkstyle:check spotbugs:check spotless:check pmd:check

  # TASK-10：Fail-Fast 启动门禁——依赖不可达时应用必须起不来，且原因指名到组件。
  #   与本地完全同一条命令：bash scripts/fail-fast-gate.sh（脚本自带断言，不靠 grep 拼凑）
  #   阶段1（build-and-gate 的 surefire）之后执行；三个场景需要一个可达的 MySQL
  #   （qdrant/minio 场景的探测排在 MySQL 之后，库不可达会先于被测组件失败），故挂 service container。
  fail-fast-gate:
    needs: build-and-gate
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: gate-root-not-a-secret
          MYSQL_DATABASE: crm_gate
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pgate-root-not-a-secret"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=24
    env:
      # dev profile 的依赖坐标全部来自环境变量（本地由 .env 提供，CI 在此提供）
      SPRING_PROFILES_ACTIVE: dev
      SLZ_DATASOURCE_HOST: 127.0.0.1
      SLZ_DATASOURCE_PORT: "3306"
      SLZ_DATASOURCE_DATABASE: crm_gate
      SLZ_DATASOURCE_USERNAME: root
      SLZ_DATASOURCE_PASSWORD: gate-root-not-a-secret
      SLZ_JWT_SECRET_KEY: gate-jwt-secret-key-not-a-secret-32b
      SLZ_JWT_TTL: "3600000"
      SLZ_ATTACH_TOKEN_KEY: gate-attach-key-not-a-secret-32b
      DASHSCOPE_API_KEY: sk-ci-placeholder-not-used
    steps:
      - name: 检出
        uses: actions/checkout@v5

      - name: 装配 JDK 21 + Maven 缓存
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Fail-Fast 启动门禁（db / qdrant / minio 三场景）
        run: bash scripts/fail-fast-gate.sh

      - name: 上传启动失败日志
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fail-fast-gate-logs
          path: target/fail-fast-gate/*.log
          if-no-files-found: ignore

  frontend-quality:
    name: Frontend Test / Lint / Type-check / Build Budget
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: 检出
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          # cache-dependency-path 按 GITHUB_WORKSPACE（仓库根）解析，不受 defaults.run.working-directory
          # 影响；缺它时按仓库根找 pnpm-lock.yaml 而实际在 frontend/ 下，Setup Node.js 即报
          # "Dependencies lock file is not found in /home/runner/work/crmAndRag/crmAndRag" 而失败
          # （job 实测仅 8s@09-26 / 6s@09-29），本 job 后续七步（Install/Gen/Lint/Type-check/Vitest/
          # 构建/体积预算）全部 skipped、从未执行（卡 H CI-1）。
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # src/api/axios 是 openapi.yaml 的生成物且被 .gitignore 排除（frontend/.gitignore:35），
      # 不在 CI 里生成的话 apiClient.ts 对 client.gen.ts 的导入直接找不到文件，类型检查无从谈起。
      - name: Generate API client from contract
        run: pnpm gen:api

      - name: Lint
        run: pnpm lint:check

      - name: Type-check
        run: pnpm type-check:check

      # 前端单元轨（Vitest）。此前 tracked 的 *.test.ts 不属于任何会自动执行的检查（spec R3），
      # 命令口径复用 frontend/AGENTS.md「Testing Guidelines」已声明的 vitest run，不新造并行命令。
      # 依赖 gen:api 产物（src/api/__tests__ 会 import 生成物），故必须在 Generate API client 之后。
      # e2e 轨道**不在此处**：frontend/vite.config.ts:66 的 test.exclude 显式排除 ['e2e/**', ...]，
      # 不是因缺配置而静默跳过；Playwright 需真后端 + 浏览器，成本受 openspec/git-workflow.md §5 闸门约束，
      # 本提案不接入默认路径（延续 add-frontend-ci 的禁止口径）。
      - name: 单元测试（Vitest）
        run: pnpm test

      # TASK-20：产物体积门禁。此前这个 job 从不 pnpm build，"包变大"在 CI 里完全不可观测。
      # 阈值不在 YAML 里，而在 frontend/bundle-budget.json（gzip 字节数），且只允许由
      #   node scripts/check-bundle-budget.mjs --update
      # 在一次真实 pnpm build 之后写入；口径与阶段3 的 scripts/test-baseline.txt 同源。
      # 没有 dist 时该脚本直接判失败——"根本没构建"不许被读成"体积达标"。
      - name: 生产构建
        run: pnpm build

      - name: gzip 体积预算校验（entry / vendor 三分 / app / total 六桶）
        run: node scripts/check-bundle-budget.mjs

  # TASK-04：线程池拒绝指标门禁（高负载测试验证指标上报）
  thread-pool-metrics-gate:
    needs: [build-and-gate, static-analysis-gate]
    runs-on: ubuntu-24.04
    steps:
      - name: 检出
        uses: actions/checkout@v5

      - name: 装配 JDK 21 + Maven 缓存
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: 线程池拒绝指标门禁（高负载模拟测试）
        run: mvn -B -ntp test -Dtest=TaskExecutorMetricsBinderTest
        env:
          # 验证拒绝策略可观测性
          VERIFY_REJECTION_METRICS: "true"

      # TASK-16：替换掉两段假门禁。旧写法①在被测文件里 grep 被测字符串
      # （grep "async.task.rejected" PlatformAsyncConfig.java）——代码里写着推断名（导出其实是
      # async_task_rejected_total）它反而更绿；②只 test -f 两份产物，文件存在但名字全错照样过。
      # 断言只能落在"引用侧 vs /actuator/prometheus 实采侧"，故换成下面两条真校验。
      - name: 监控资产一致性对账（纯 JVM，指标名/label 必须等于实采清单）
        run: mvn -B -ntp test -Dtest=MonitoringArtifactConsistencyTest

      - name: promtool 校验告警规则与抓取配置
        run: |
          docker run --rm -v "$PWD/deploy/prometheus:/t:ro" --entrypoint promtool prom/prometheus:v3.4.1 \
            check rules /t/alert-rules.yml
          docker run --rm -v "$PWD/deploy/prometheus:/t:ro" --entrypoint promtool prom/prometheus:v3.4.1 \
            check config /t/prometheus.yml

      - name: 上传指标报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: thread-pool-metrics-report
          path: target/surefire-reports/*.txt
          if-no-files-found: ignore

