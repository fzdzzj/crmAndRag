# ================================================================
# CI 门禁（task18：契约/安全/数据权限/韧性/RAG 评估纳入 CI + 回归阈值）
# 触发：推送与 PR。ubuntu-latest 自带 Docker → Testcontainers IT（含 Flyway 真库迁移）可真跑。
# 门禁语义：任一阶段失败即阻止合入；单元测试(surefire) + 集成测试(failsafe) 分开跑，先快后慢。
# ================================================================
name: CI

on:
  push:
    branches: [ master, integration, "spec/**", "feature/**" ]
  pull_request:

jobs:
  build-and-gate:
    runs-on: ubuntu-latest
    steps:
      - name: 检出
        uses: actions/checkout@v4

      - name: 装配 JDK 21 + Maven 缓存
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # 阶段1：编译 + 单元测试（surefire，*Test.java，含 SSE 契约测试、H2 上下文冒烟）——快，先拦低级错误
      - name: 单元测试与契约门禁（surefire）
        run: mvn -B -ntp test

      # 阶段2：集成测试（failsafe，*IT.java，Docker：Testcontainers MySQL）
      #   - FlywayMigrationIT：七脚本真库按序迁移（本地无 Docker 会 skip，CI 必跑）
      #   - AbstractMySqlIT 系列：全上下文 + 控制器/数据权限/写链回归
      #   - RagRealRetrievalBenchmarkIT：真检索质量基准（add-rag-quality-baseline），env 门控——
      #     仅当 RAG_BENCHMARK_REAL=1 且有 DASHSCOPE_API_KEY 才执行；默认 CI 恒按假设 skip、不发外网请求，
      #     启用后把含全部指标的 JSON 报告落盘 docs/rag-quality/baseline-v1.json（提案 2–5 的不回退锚点）
      - name: 集成测试门禁（failsafe + Testcontainers MySQL）
        run: mvn -B -ntp verify

      # 阶段3：回归基线阈值——两个报告目录分开裁决，防止合并悄悄丢测试
      #   口径A surefire = target/surefire-reports（pom 的 **/*Test.java，显式 exclude **/*IT.java），基线 645
      #   实测：2026-09-16 本机 mvn -B -ntp test，Tests run 合计 645（=644 + fix-i05-caption-chunk 新增1：RagBenchmarkDataPreparerTest 图注黄金词面断言1；上一版 644 =639 + trace-i05-citation-forensics 新增5：BenchmarkOnlyFilterTest only过滤3+旁路JSON1+enrich回填1；再上一版 639 =634 + add-vision-pdf-ingest-pilot 新增5：
      #     DocumentServiceTest 视觉PDF默认关/开+mock/失败回退/富文本不走VLM/无参构造 5；上一版 634 =628 + fix-multicondition-recall 新增6：
      #     ConstraintQuerySplitterTest 6；上一版 628 =625 + add-excel-header-projection 新增3：
      #     DocumentServiceTest 多列表头投影+首行超长不投影 2 + RagBenchmarkDataPreparerTest 黄金行列名断言 1；上一版 625 =619 + fix-citation-alignment 新增6：
      #     CitationAlignerTest 6；上一版 619 = 618 + expand-rag-benchmark 新增1：
      #     RagBenchmarkDataPreparerTest.expandedSuiteV2SizeAndCategoryBreakdown；上一版 618 = 615 + drift-disposition 新增3：
      #     KnownDriftRegistryTest 3；再上一版 615 = 602 + audit-permission-matrix 新增13：
      #     PermissionCoverageScannerTest 7 + PermissionCoverageComparatorTest 6；更上一版 602 = 590 +
      #     audit-entity-table-drift 新增12：SchemaDriftAuditorTest 5 + SchemaDriftComparatorTest 7）。
      #     此前基线 590（=555 + 提案5新增30 + 基线阶梯 runner 泛化新增5；明细见上一版注释）。
      #   单测不依赖 Docker，CI 与本机同口径，因此 645 对两边都成立；只增不减。
      #     V6 保留字缺陷已于 2026-09-12 获授权就地修复：真库迁移链 V1..V23 首次完整应用，
      #       failsafe 真跑口径 24 = 15 绿 + 7 门控跳过 + 2 红（WriteChainRegressionIT 为 task18 时代
      #       存量测试缺陷另案登记，见 openspec/changes/complete-hybrid-retrieval-and-rerank/tasks.md §0）。
      #   口径B failsafe = target/failsafe-reports（pom 的 **/*IT.java 与 **/*IntegrationTest.java），基线 13
      #     实测：2026-09-13 failsafe:integration-test 白名单列出 8 个可执行 IT，Tests run 合计 13
      #     （CompanyGroupDeleteIT 4 / CustomerCompanyControllerIT 1 / CustomerCompanyDeptUniqueIT 2 /
      #       PermissionControllerIT 3 / WriteChainRegressionIT 2 / V1BaselineMySqlIT 1 / FlywayMigrationIT 0 /
      #       PermissionCoverageAuditIT 2）。
      #       PermissionControllerIT 由 close-permission-read-gap 启用 2 个停放用例并新增 1 个正向用例
      #       → 2 disabled → 3 运行（2026-09-13 本地 Docker 实测 3 绿）。
      #       PermissionCoverageAuditIT 为本提案新增，纯 JVM 静态扫描无 Docker 依赖，2026-09-13 本地实测 2/0/0 绿。
      #       apply-permission-matrix（2026-09-14）再增 8 个 Docker 依赖 IT 用例：PermissionsInterceptorStatusIT 3 +
      #       PermissionApplyReportIT 5（均 extend AbstractMySqlIT，需 Docker 实跑，本机无 Docker 未实跑）。
      #     ⚠ 13 是「无 Docker 下限」，不是 CI 期望值：FlywayMigrationIT 无 Docker 时整类被 @BeforeAll 假设中止记 0，
      #       且本轮排除 ModelProviderImplDashScopeIT（3 个 @Test，会发真实外网请求）。
      #       CI 有 Docker 时按 3 运行计新增 SchemaDriftAuditIT 1 + apply-permission-matrix 8 后推算为 28
      #       （=13+PermissionControllerIT-2+3+FlywayMigrationIT1+ModelProvider3+SchemaDriftAuditIT1+
      #       PermissionCoverageAuditIT2+PermissionsInterceptorStatusIT3+PermissionApplyReportIT5，推算值非实测）。
      #     TODO（首次 Docker 可用的 CI 跑完立即做）：按 target/failsafe-reports 的实测合计把 13 上调到真实值，
      #       否则丢掉最多 4 个 IT 用例不会被本门禁拦住。
      #   失败关闭：目录缺失、目录内无 .txt 报告、求和为空或非数字，一律 exit 1，不允许静默通过。
      #   两个比较都会执行（不因前一个失败而跳过后一个），任一低于基线即失败。
      - name: 回归基线阈值校验（surefire + failsafe 双口径）
        run: |
          set -uo pipefail

          check_baseline() {
            dir="$1"; baseline="$2"; label="$3"
            if [ ! -d "$dir" ]; then
              echo "::error::${label} 报告目录不存在：${dir}（该类测试根本没执行）"
              return 1
            fi
            files=$(find "$dir" -maxdepth 1 -name '*.txt' -type f | wc -l | tr -d ' ')
            if [ -z "$files" ] || [ "$files" -eq 0 ]; then
              echo "::error::${dir} 下没有 .txt 报告，${label} 测试根本没执行"
              return 1
            fi
            total=$(grep -rhoE "Tests run: [0-9]+" "$dir"/*.txt | awk -F': ' '{s+=$2} END {print s+0}')
            if [ -z "$total" ]; then
              echo "::error::${label} 求和结果为空，无法裁决（目录=${dir}，报告数=${files}）"
              return 1
            fi
            case "$total" in
              *[!0-9]*)
                echo "::error::${label} 求和结果非数字：'${total}'，无法裁决"
                return 1
                ;;
            esac
            echo "${label}：报告文件=${files}，Tests run 合计=${total}，基线=${baseline}（目录=${dir}）"
            if [ "$total" -lt "$baseline" ]; then
              echo "::error::${label} 测试数 ${total} < 基线 ${baseline}，疑似丢测试"
              return 1
            fi
            return 0
          }

          rc=0
          check_baseline target/surefire-reports 645 "surefire 单元测试" || rc=1
          check_baseline target/failsafe-reports 13 "failsafe 集成测试" || rc=1
          if [ "$rc" -ne 0 ]; then
            echo "::error::回归基线阈值校验未通过（surefire 基线 645 / failsafe 基线 13）"
          fi
          exit "$rc"

      - name: 上传覆盖率与测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            target/site/jacoco/
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: ignore
