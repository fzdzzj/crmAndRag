# ================================================================
# CI 门禁（task18：契约/安全/数据权限/韧性/RAG 评估纳入 CI + 回归阈值）
# 触发：推送与 PR。ubuntu-latest 自带 Docker → Testcontainers IT（含 Flyway 真库迁移）可真跑。
# 门禁语义：任一阶段失败即阻止合入；单元测试(surefire) + 集成测试(failsafe) 分开跑，先快后慢。
# ================================================================
name: CI

on:
  push:
    branches: [ master, integration, "spec/**", "feature/**" ]
  pull_request:

jobs:
  build-and-gate:
    runs-on: ubuntu-latest
    steps:
      - name: 检出
        uses: actions/checkout@v4

      - name: 装配 JDK 21 + Maven 缓存
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # 阶段1：编译 + 单元测试（surefire，*Test.java，含 SSE 契约测试、H2 上下文冒烟）——快，先拦低级错误
      - name: 单元测试与契约门禁（surefire）
        run: mvn -B -ntp test

      # 阶段2：集成测试（failsafe，*IT.java，Docker：Testcontainers MySQL）
      #   - FlywayMigrationIT：七脚本真库按序迁移（本地无 Docker 会 skip，CI 必跑）
      #   - AbstractMySqlIT 系列：全上下文 + 控制器/数据权限/写链回归
      #   - RagRealRetrievalBenchmarkIT：真检索质量基准（add-rag-quality-baseline），env 门控——
      #     仅当 RAG_BENCHMARK_REAL=1 且有 DASHSCOPE_API_KEY 才执行；默认 CI 恒按假设 skip、不发外网请求，
      #     启用后把含全部指标的 JSON 报告落盘 docs/rag-quality/baseline-v1.json（提案 2–5 的不回退锚点）
      - name: 集成测试门禁（failsafe + Testcontainers MySQL）
        run: mvn -B -ntp verify

      # 阶段3：回归基线门禁——由仓库自有脚本裁决，本地与 CI 跑同一条命令：
      #   bash scripts/check-test-baseline.sh
      # 阈值不在 YAML 里，而在 scripts/test-baseline.txt，且只允许由
      #   bash scripts/check-test-baseline.sh --update
      # 在一次真实 mvn -B -ntp clean verify 之后写入；当前运行含 Failures/Errors 时 --update 直接拒绝。
      # 脚本同时裁决四项：Failures 与 Errors 必须为 0、Tests run 不低于基线（防丢测试）、
      # Skipped 不高于基线（防整类被悄悄跳过；旧实现只对 Tests run 求和，看不到这一项）。
      # 历史阶梯 639/644/645/649/653/657 与 failsafe 13 的来龙去脉见：
      #   git log -p -- scripts/test-baseline.txt .github/workflows/ci.yml
      - name: 回归基线阈值校验（surefire + failsafe 双口径）
        run: bash scripts/check-test-baseline.sh

      - name: 上传覆盖率与测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            target/site/jacoco/
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: ignore

  # TASK-09：前后端契约一致性门禁。判定就在阶段 1 的那条 surefire 用例里
  # （OpenApiContractExportTest 起完整上下文打 /v3/api-docs.yaml 与 frontend/openapi.yaml 逐字比对），
  # 本 job 只是把它单独立哨并打印差异，便于漂移时一眼看到少了哪个接口。
  # 故意与 build-and-gate 并行：等 Docker 集成测试跑完再报契约漂移只会拖慢反馈，不会增加信号。
  openapi-consistency-gate:
    name: OpenAPI Contract Consistency
    runs-on: ubuntu-latest
    steps:
      - name: 检出
        uses: actions/checkout@v4

      - name: 装配 JDK 21 + Maven 缓存
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: 后端 swagger 导出与前端契约比对
        run: bash scripts/check-openapi-consistency.sh

      - name: 上传后端当前导出
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openapi-export
          path: target/openapi/openapi.yaml
          if-no-files-found: warn

  # TASK-02：静态检查门禁（checkstyle/spotbugs/pmd/spotless）
  static-analysis-gate:
    needs: build-and-gate
    runs-on: ubuntu-latest
    steps:
      - name: 检出
        uses: actions/checkout@v4

      - name: 装配 JDK 21 + Maven 缓存
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: 静态检查门禁（checkstyle/spotbugs/pmd/spotless）
        run: mvn -B -ntp checkstyle:check spotbugs:check pmd:check spotless:check
        env:
          CHECKSTYLE_MAX_VIOLATIONS: 0
          SPOTBUGS_MAX_HIGH: 0
          PMD_MAX_VIOLATIONS: 5
          SPOTLESS_APPLY_DIFF: 0

  # TASK-10：Fail-Fast 启动门禁——依赖不可达时应用必须起不来，且原因指名到组件。
  #   与本地完全同一条命令：bash scripts/fail-fast-gate.sh（脚本自带断言，不靠 grep 拼凑）
  #   阶段1（build-and-gate 的 surefire）之后执行；三个场景需要一个可达的 MySQL
  #   （qdrant/minio 场景的探测排在 MySQL 之后，库不可达会先于被测组件失败），故挂 service container。
  fail-fast-gate:
    needs: build-and-gate
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: gate-root-not-a-secret
          MYSQL_DATABASE: crm_gate
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pgate-root-not-a-secret"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=24
    env:
      # dev profile 的依赖坐标全部来自环境变量（本地由 .env 提供，CI 在此提供）
      SPRING_PROFILES_ACTIVE: dev
      SLZ_DATASOURCE_HOST: 127.0.0.1
      SLZ_DATASOURCE_PORT: "3306"
      SLZ_DATASOURCE_DATABASE: crm_gate
      SLZ_DATASOURCE_USERNAME: root
      SLZ_DATASOURCE_PASSWORD: gate-root-not-a-secret
      SLZ_JWT_SECRET_KEY: gate-jwt-secret-key-not-a-secret-32b
      SLZ_JWT_TTL: "3600000"
      SLZ_ATTACH_TOKEN_KEY: gate-attach-key-not-a-secret-32b
      DASHSCOPE_API_KEY: sk-ci-placeholder-not-used
    steps:
      - name: 检出
        uses: actions/checkout@v4

      - name: 装配 JDK 21 + Maven 缓存
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Fail-Fast 启动门禁（db / qdrant / minio 三场景）
        run: bash scripts/fail-fast-gate.sh

      - name: 上传启动失败日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fail-fast-gate-logs
          path: target/fail-fast-gate/*.log
          if-no-files-found: ignore

  frontend-quality:
    name: Frontend Lint / Type-check / Build Budget
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: 检出
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # src/api/axios 是 openapi.yaml 的生成物且被 .gitignore 排除（frontend/.gitignore:35），
      # 不在 CI 里生成的话 apiClient.ts 对 client.gen.ts 的导入直接找不到文件，类型检查无从谈起。
      - name: Generate API client from contract
        run: pnpm gen:api

      - name: Lint
        run: pnpm lint:check

      - name: Type-check
        run: pnpm type-check:check

      # TASK-20：产物体积门禁。此前这个 job 从不 pnpm build，"包变大"在 CI 里完全不可观测。
      # 阈值不在 YAML 里，而在 frontend/bundle-budget.json（gzip 字节数），且只允许由
      #   node scripts/check-bundle-budget.mjs --update
      # 在一次真实 pnpm build 之后写入；口径与阶段3 的 scripts/test-baseline.txt 同源。
      # 没有 dist 时该脚本直接判失败——"根本没构建"不许被读成"体积达标"。
      - name: 生产构建
        run: pnpm build

      - name: gzip 体积预算校验（entry / vendor 三分 / app / total 六桶）
        run: node scripts/check-bundle-budget.mjs

  # TASK-04：线程池拒绝指标门禁（高负载测试验证指标上报）
  thread-pool-metrics-gate:
    needs: [build-and-gate, static-analysis-gate]
    runs-on: ubuntu-latest
    steps:
      - name: 检出
        uses: actions/checkout@v4

      - name: 装配 JDK 21 + Maven 缓存
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: 线程池拒绝指标门禁（高负载模拟测试）
        run: mvn -B -ntp test -Dtest=TaskExecutorMetricsBinderTest
        env:
          # 验证拒绝策略可观测性
          VERIFY_REJECTION_METRICS: "true"

      # TASK-16：替换掉两段假门禁。旧写法①在被测文件里 grep 被测字符串
      # （grep "async.task.rejected" PlatformAsyncConfig.java）——代码里写着推断名（导出其实是
      # async_task_rejected_total）它反而更绿；②只 test -f 两份产物，文件存在但名字全错照样过。
      # 断言只能落在"引用侧 vs /actuator/prometheus 实采侧"，故换成下面两条真校验。
      - name: 监控资产一致性对账（纯 JVM，指标名/label 必须等于实采清单）
        run: mvn -B -ntp test -Dtest=MonitoringArtifactConsistencyTest

      - name: promtool 校验告警规则与抓取配置
        run: |
          docker run --rm -v "$PWD/deploy/prometheus:/t:ro" --entrypoint promtool prom/prometheus:v3.4.1 \
            check rules /t/alert-rules.yml
          docker run --rm -v "$PWD/deploy/prometheus:/t:ro" --entrypoint promtool prom/prometheus:v3.4.1 \
            check config /t/prometheus.yml

      - name: 上传指标报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thread-pool-metrics-report
          path: target/surefire-reports/*.txt
          if-no-files-found: ignore

