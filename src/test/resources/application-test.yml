spring:
  application:
    name: crm

  # 测试数据源配置 - 使用H2内存数据库
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    username: sa
    password:

  # 测试环境缓存配置
  cache:
    type: caffeine
    caffeine:
      spec: expireAfterWrite=1m,initialCapacity=10,maximumSize=100

  # H2控制台（调试用）
  h2:
    console:
      enabled: false

  # SQL初始化配置
  sql:
    init:
      mode: never

# 权限同步配置 - 测试时禁用
permission:
  sync:
    enabled: false

# com.tangzc 自动建表配置 - 测试时启用
auto-table:
  mode: create
  model-package: com.slz.crm.pojo.entity
  show-banner: false

# MyBatis Plus配置
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.slz.crm.server.entity
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 测试环境JWT配置
slz:
  jwt:
    secret-key: test-secret-key-for-e2e-testing-12345678
    ttl: 3600000
    token-name: token
  # 测试环境附件下载令牌密钥（仅供测试，非生产凭据，24 字节 = AES-192）
  attach-token:
    secret-key: test-attach-token-key-24

  # 测试环境文件路径配置
  file:
    path: ./test-files

# 日志配置
logging:
  level:
    root: WARN
    com.slz.crm: INFO
    org.springframework.web: WARN
    org.springframework.security: WARN
    com.tangzc: WARN